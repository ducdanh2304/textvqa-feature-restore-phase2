[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "textvqa-feature-restore"
version = "0.2.0"
description = "Reproducible Phase-2 frozen-feature caching and residual-adapter training for Scene Text VQA"
requires-python = ">=3.10,<3.12"
license = {text = "MIT"}
dependencies = [
  "torch==2.6.0",
  "transformers==4.57.6",
  "qwen-vl-utils==0.0.14",
  "accelerate==1.10.1",
  "huggingface-hub==0.36.0",
  "numpy==2.1.3",
  "pandas==2.2.3",
  "Pillow==11.3.0",
  "PyYAML==6.0.2",
  "matplotlib==3.10.3",
  "tqdm==4.67.1",
  "rapidfuzz==3.14.1",
  "kaggle==1.7.4.5",
  "datasets==3.6.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
textvqa-phase2 = "textvqa_feature_restore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

